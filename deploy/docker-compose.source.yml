# Required final overlay for a public release. Build every application image from
# the one prepared tree whose source download is served by that tree's UI.
# See docs/source-releases.md. DOCQA_RELEASE_DIR must be an absolute local path.
services:
  db:
    volumes:
      - ${DOCQA_RELEASE_DIR:?Set DOCQA_RELEASE_DIR}/deploy/db/init-runtime.sh:/docker-entrypoint-initdb.d/10-docqa-runtime.sh:ro
  migrate:
    build:
      context: ${DOCQA_RELEASE_DIR:?Prepare a source release and set DOCQA_RELEASE_DIR}
    volumes:
      - ${DOCQA_RELEASE_DIR:?Set DOCQA_RELEASE_DIR}/deploy:/app/deploy:ro
  api:
    build:
      context: ${DOCQA_RELEASE_DIR:?Set DOCQA_RELEASE_DIR}
  worker:
    build:
      context: ${DOCQA_RELEASE_DIR:?Set DOCQA_RELEASE_DIR}
  beat:
    build:
      context: ${DOCQA_RELEASE_DIR:?Set DOCQA_RELEASE_DIR}
  ui:
    build:
      context: ${DOCQA_RELEASE_DIR:?Set DOCQA_RELEASE_DIR}/ui
