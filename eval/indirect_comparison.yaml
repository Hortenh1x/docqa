# These are frozen evidence-search queries for a deterministic retrieval-layer sweep.
# Live --with-answers runs exercise the current question-only planner instead.
retrieval_queries:
  original: "and what year was financially better for amazon? 2017 or 2022?"
  amazon_2017: "Amazon 2017 annual financial results revenue net income operating income profit margin cash flow"
  amazon_2022: "Amazon 2022 annual financial results revenue net income operating income profit margin cash flow"

coverage_caps: [8, 12, 16, 20, 40]
answer_cap: 16
context_token_budget: 18000

answer_expectations:
  required_years: [2017, 2022]
  required_citation_documents: [AMAZON_2017_10K.pdf, AMAZON_2022_10K.pdf]
  acceptable_criteria: [profitability, net income, net loss, net sales, revenue, operating income, scale]
  require_qualified_winner: true
  # A calculation is not required to be refused when its operands are grounded.
  require_refusal_for_computable_metrics: false

limitations:
  - Vector-only retrieval; no PostgreSQL FTS, RRF, reranker, or access-restricted chunks.
  - Three filings, not the full 334-filing FinanceBench collection or screenshot collection.
  - The standalone question is used exactly; conversation history is outside scope.
