# Access-levels golden set for the Kranich demo corpus (facts F25–F32, traps T9–T11 in
# plans/docqa-corpus-prompt.md). Every question exists in two flavours: asked under a
# role that may NOT read the passage (expected_refusal + hidden_sources: the document
# must not surface at all) and under the least-privileged role that may (expected
# answer + sources). Run against a collection seeded from corpus/build:
#   uv run python -m eval.run_eval --collection <id> --golden eval/golden_access.yaml \
#     --results eval/results_access.md --with-answers --api-key <key>
# (--role only applies to entries without a role; every entry here names one.)

# --- F25: card limit (FIN-001 §8, Finance) ---
- id: a001
  category: access
  role: employee
  question: "What is the single-transaction limit on the corporate card?"
  expected_refusal: true
  hidden_sources: [{ doc: "FIN-001", section: "8" }]
  expected_hidden_labels: ["finance"]
  notes: "F25 under employee"
- id: a002
  category: access
  role: finance
  question: "What is the single-transaction limit on the corporate card?"
  expected_answer: "€1,500; anything above needs CFO approval before the purchase"
  expected_sources: [{ doc: "FIN-001", section: "8" }]
  notes: "F25 unlocked"
- id: a003
  category: access
  role: hr
  question: "Above which card amount does the CFO have to approve a purchase?"
  expected_refusal: true
  hidden_sources: [{ doc: "FIN-001", section: "8" }]
  expected_hidden_labels: ["finance"]
  notes: "F25: HR is a sibling of Finance, not above it"
- id: a004
  category: access
  role: leadership
  question: "Above which card amount does the CFO have to approve a purchase?"
  expected_answer: "€1,500 per transaction"
  expected_sources: [{ doc: "FIN-001", section: "8" }]
  notes: "F25 leadership sees everything"

